name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "lua/plugins/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: pip install "Markdown==3.7"

      # The keymap page is generated from a running Neovim, but the dump needs
      # the full plugin set and parser toolchain. That is not reproducible on a
      # stock runner (it hangs loading plugins whose grammars are missing), so
      # site/keymaps.tsv is committed and refreshed locally with
      # `python3 site/build.py --refresh-keys`.
      #
      # CI does not regenerate it. It checks that the cache still describes the
      # current configuration, so a stale table fails the build instead of
      # being published.
      - name: Build site
        run: python3 site/build.py
        env:
          KEYMAP_REQUIRE_FRESH: "1"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
