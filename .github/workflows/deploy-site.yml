name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "lua/plugins/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: pip install "Markdown==3.7"

      # The keymap page is generated from a running Neovim. That needs the
      # plugins actually installed, so restore them from the committed lockfile
      # before building. Without this the build would fall back to the cached
      # site/keymaps.tsv and silently go stale.
      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.5

      - name: Cache plugins
        uses: actions/cache@v4
        with:
          path: ~/.local/share/nvim/lazy
          key: lazy-${{ hashFiles('lazy-lock.json') }}

      - name: Install plugins
        run: |
          nvim --headless --cmd 'let g:mapleader = " "' \
               '+Lazy! restore' +qa || nvim --headless '+Lazy! sync' +qa

      - name: Refresh keymap dump
        run: python3 site/build.py --refresh-keys

      - name: Build site
        run: python3 site/build.py
        env:
          # Fail rather than quietly shipping a stale reference table.
          KEYMAP_STRICT: "1"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
